<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOU SEEM PRETTY SAD | Jugar</title>
<link rel="icon" href="../img/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#12091f;color:#fff;overflow:hidden;font-family:"Gaegu",cursive}
#unity-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12091f}
#unity-canvas{width:100%;height:100%;background:#12091f;display:block;outline:none}
#cargando{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#4a2370,#12091f 70%);padding:20px}
#cargando h1{margin:0;font:400 clamp(56px,11vw,120px)/.8 "Reenie Beanie",cursive;color:#fff;text-shadow:3px 3px 0 #d6336c}
#cargando p{font-size:22px;color:#ffd6ea;margin:14px 0}
.barra{width:min(420px,80vw);height:16px;border:3px solid #ff8fc8;border-radius:999px;overflow:hidden;background:#2a1240}
.barra div{height:100%;width:0;background:#ff8fc8;transition:width .2s}
#aviso{position:absolute;left:0;right:0;bottom:0;display:none;background:#d6336c;padding:8px 14px;font-size:20px;text-align:center}
#pc{position:absolute;right:12px;top:10px;z-index:5;font:700 18px "Gaegu",cursive;border:2px solid #ff8fc8;background:#1c0d2fcc;color:#ffd6ea;border-radius:999px;padding:5px 14px;cursor:pointer;display:none}
#pc:hover{background:#ff8fc8;color:#2a1240}
</style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <button id="pc" type="button">pantalla completa</button>
  <div id="cargando">
    <h1>you seem<br>pretty sad</h1>
    <p id="txt">Cargando... la primera vez puede tardar un poco</p>
    <div class="barra"><div id="prog"></div></div>
    <p style="font-size:18px;opacity:.8">Denis Medrano Carrasco · Ariana Patzi Gonzales</p>
  </div>
  <div id="aviso"></div>
</div>
<script>
(function(){
  var base="Build/";
  var ext=/*EXT*/".unityweb";
  var cfg={
    arguments:[],
    dataUrl:base+"Web.data"+ext,
    frameworkUrl:base+"Web.framework.js"+ext,
    codeUrl:base+"Web.wasm"+ext,
    streamingAssetsUrl:"StreamingAssets",
    companyName:"DefaultCompany",
    productName:"YOU SEEM PRETTY SAD",
    productVersion:"1.0",
    devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
    showBanner:function(m,t){var a=document.getElementById("aviso");a.textContent=m.replace(/<[^>]*>/g,"");a.style.display="block";if(t!=="error")setTimeout(function(){a.style.display="none"},5000)}
  };
  var canvas=document.getElementById("unity-canvas"),txt=document.getElementById("txt"),prog=document.getElementById("prog");
  var s=document.createElement("script");s.src=base+"Web.loader.js";
  s.onload=function(){
    createUnityInstance(canvas,cfg,function(p){prog.style.width=(100*p)+"%";txt.textContent="Cargando... "+Math.round(100*p)+" %"}).then(function(u){
      document.getElementById("cargando").style.display="none";
      var b=document.getElementById("pc");b.style.display=(window.top!==window.self)?"none":"block";b.onclick=function(){u.SetFullscreen(1)};
      canvas.focus();document.addEventListener("click",function(){canvas.focus()});
    }).catch(function(e){txt.textContent="No se pudo cargar el juego. Recarga con Ctrl + F5 o prueba otro navegador.";console.error(e)});
  };
  s.onerror=function(){txt.textContent="No se encontraron los archivos del juego (carpeta Build)."};
  document.body.appendChild(s);
})();
</script>
</body>
</html>
